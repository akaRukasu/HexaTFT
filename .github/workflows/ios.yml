name: Build and test iOS
on:
  workflow_dispatch:
  push:
    paths: ['HexaTFT/**', 'HexaTFTTests/**', 'HexaTFTUITests/**', 'HexaTFT.xcodeproj/**', 'scripts/**', 'server/**', '.github/workflows/ios.yml']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled data
        run: |
          python3 scripts/check_content.py
          python3 -m unittest discover -s server -v
      - name: Choose an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run native checks
        run: xcodebuild test -project HexaTFT.xcodeproj -scheme HexaTFT -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device application
        env:
          HEXA_META_SERVICE: ${{ vars.HEXA_META_SERVICE }}
        run: |
          xcodebuild -project HexaTFT.xcodeproj -scheme HexaTFT -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO HEXA_META_SERVICE="$HEXA_META_SERVICE"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HexaTFT.app Payload/
          zip -qry HexaTFT-unsigned.ipa Payload
      - name: Save unsigned application
        id: save-ipa
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: HexaTFT-unsigned
          path: HexaTFT-unsigned.ipa
      - name: Export interface screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
      - name: Save build to a private draft release if artifact storage fails
        if: steps.save-ipa.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-build-$GITHUB_RUN_ID"
          if ! gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx true; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "HexaTFT iOS · ${GITHUB_SHA:0:7}" --notes "Compilation iOS non signée · $GITHUB_SHA."
          fi
          gh release upload "$tag" HexaTFT-unsigned.ipa --clobber
          if [ -d screenshots ]; then
            zip -qry HexaTFT-screenshots.zip screenshots
            gh release upload "$tag" HexaTFT-screenshots.zip --clobber
          fi
      - name: Save screenshots
        if: always() && steps.save-ipa.outcome != 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Save test results
        if: always() && steps.save-ipa.outcome != 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
